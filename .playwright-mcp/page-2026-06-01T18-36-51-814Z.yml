        - generic [ref=e171]:
          - paragraph [ref=e172]: "\"For a firm our size, getting in front of the right institutional allocators used to take months of travel and cold outreach. Now we can have 20+ high-quality, pre-qualified meetings in a few days with LPs who are genuinely aligned to our strategy. The depth of the allocator database and the matching tools let us focus our energy where it matters most — building real relationships with investors who are actually ready to deploy capital.\""

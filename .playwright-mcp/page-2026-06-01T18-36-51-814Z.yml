          - paragraph [ref=e178]: "\"No other platform gives us this level of direct access to the fund managers we want to work with. We use it as our primary lead generation channel — the concentration of GPs across every asset class and AUM range means our business development team can run a highly targeted outreach strategy. The density of the ecosystem in one place is something we simply can't replicate anywhere else.\""
